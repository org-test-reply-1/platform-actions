name: Docker Build & Push (ARC Runner)
description: >
  Builds and publishes the custom runner image to GHCR with semver tagging.

inputs:
  registry:
    description: "Container registry"
    required: false
    default: "ghcr.io"

  image_name:
    description: "Image name (e.g. org/aks-arc-runner)"
    required: true

  version:
    description: "Semver version (e.g. 1.2.3). If empty, the patch is auto-incremented from the latest Git tag."
    required: false
    default: ""

  dockerfile_path:
    required: false
    default: "./arc-runner-image/Dockerfile"

  context_path:
    required: false
    default: "./arc-runner-image"

outputs:
  image_full_tag:
    description: "Full published tag (registry/image:tag)"
    value: ${{ steps.meta.outputs.full_tag }}

  version:
    description: "Semver version used (e.g. 1.2.3)"
    value: ${{ steps.meta.outputs.version }}

  image_digest:
    description: "SHA digest of the published image"
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------ #
    # 1. Calculate semver version
    #    - If the version input is provided, use it directly
    #    - Otherwise read the latest Git tag (vX.Y.Z) and increment patch
    #    - If no tags exist, start at 0.1.0
    # ------------------------------------------------------------------ #
    - name: Calculate semver version
      id: meta
      shell: bash
      run: |
        INPUT_VERSION="${{ inputs.version }}"

        if [ -n "$INPUT_VERSION" ]; then
          # Use explicitly provided version (strip v prefix if present)
          VERSION="${INPUT_VERSION#v}"
        else
          # Read the latest Git semver tag
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="0.1.0"
          else
            # Extract major, minor, patch and increment patch
            MAJOR=$(echo "$LAST_TAG" | sed 's/v\([0-9]*\)\..*/\1/')
            MINOR=$(echo "$LAST_TAG" | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
            PATCH=$(echo "$LAST_TAG" | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\).*/\1/')
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
        fi

        FULL="${{ inputs.registry }}/${{ inputs.image_name }}:${VERSION}"
        FULL_LATEST="${{ inputs.registry }}/${{ inputs.image_name }}:latest"

        echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
        echo "full_tag=${FULL}"         >> "$GITHUB_OUTPUT"
        echo "full_latest=${FULL_LATEST}" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION}"
        echo "Tag: ${FULL}"

    # ------------------------------------------------------------------ #
    # 2. Login to GHCR
    # ------------------------------------------------------------------ #
    - name: Login to ghcr.io
      shell: bash
      run: |
        echo "${{ github.token }}" | docker login ghcr.io \
          --username ${{ github.actor }} \
          --password-stdin

    # ------------------------------------------------------------------ #
    # 3. Build - tag both version and latest
    # ------------------------------------------------------------------ #
    - name: Docker build
      shell: bash
      run: |
        docker build \
          --file ${{ inputs.dockerfile_path }} \
          --tag ${{ steps.meta.outputs.full_tag }} \
          --tag ${{ steps.meta.outputs.full_latest }} \
          --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
          --label "org.opencontainers.image.revision=${{ github.sha }}" \
          --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          ${{ inputs.context_path }}

    # ------------------------------------------------------------------ #
    # 4. Push - push both version and latest
    # ------------------------------------------------------------------ #
    - name: Docker push
      id: push
      shell: bash
      run: |
        docker push ${{ steps.meta.outputs.full_tag }}
        docker push ${{ steps.meta.outputs.full_latest }}

        DIGEST=$(docker inspect \
          --format='{{index .RepoDigests 0}}' \
          ${{ steps.meta.outputs.full_tag }} 2>/dev/null \
          || docker image inspect \
          --format='{{.Id}}' \
          ${{ steps.meta.outputs.full_tag }})
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------ #
    # 5. Create Git tag for the pushed version
    # ------------------------------------------------------------------ #
    - name: Create Git tag
      shell: bash
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch --tags --force

        git tag "v${{ steps.meta.outputs.version }}"
        git push origin "v${{ steps.meta.outputs.version }}"
        echo "Tag created: v${{ steps.meta.outputs.version }}"

    # ------------------------------------------------------------------ #
    # 6. Summary
    # ------------------------------------------------------------------ #
    - name: Summary
      shell: bash
      run: |
        echo "### Docker Build & Push complete" >> "$GITHUB_STEP_SUMMARY"
        echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Version | \`${{ steps.meta.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Image | \`${{ steps.meta.outputs.full_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Latest | \`${{ steps.meta.outputs.full_latest }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
