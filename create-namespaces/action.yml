name: Create Kubernetes Namespaces
description: "Creates a list of Kubernetes namespaces if they do not already exist"

inputs:
  namespaces:
    description: "Comma-separated list of namespaces to create"
    required: true

runs:
  using: composite
  steps:
    - name: Create namespaces (if absent)
      shell: bash
      run: |
        IFS=',' read -ra NS_LIST <<< "${{ inputs.namespaces }}"
        for ns in "${NS_LIST[@]}"; do
          ns=$(echo "$ns" | xargs)
          echo "Ensuring namespace: $ns"
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
        done
