name: Copilot Run Agent
description: 'Creates an AI scan issue and assigns it to the Coding Agent for a full code analysis'

inputs:
  task-prompt:
    description: 'Detailed prompt for the Coding Agent'
    required: false
    default: |
      ## Full source code analysis

      Scan **all** source code in this repository, including:
      - CI/CD workflows and pipelines (`.github/workflows/`)
      - Scripts (PowerShell, Bash)
      - Dockerfiles and container configuration
      - Application code (.cs, .csproj, .json, .xml, .config)
      - Configuration files and secrets management

      ### Analysis objectives:
      1. **Security**: vulnerabilities, hardcoded secrets, injection, misconfiguration
      2. **Code quality**: code smells, duplication, excessive complexity
      3. **Best practices**: missing patterns, suboptimal configurations
      4. **Pipeline**: workflow issues, excessive permissions, missing validations

      ### Expected output:
      - Detailed report with severity levels (CRITICAL, HIGH, MEDIUM, LOW)
      - For each issue: description, affected file, line number (where possible), suggested fix
      - Propose **ONE single Pull Request** with all fixes for CRITICAL and HIGH security issues
      - The PR must reference this issue with "Closes #NUMBER" in the body
      - Include an overall code quality summary
      - Do NOT create multiple issues or PRs: everything in a single PR linked to this issue
  scan-paths:
    description: 'Paths to scan (default: entire repository)'
    required: false
    default: '.'
  issue-title:
    description: 'Issue title'
    required: false
    default: 'AI Security & Quality Scan'
  labels:
    description: 'Labels for the issue (comma-separated)'
    required: false
    default: 'copilot-auto,security,code-quality'
  assign-pat:
    description: 'Fine-grained PAT with Issues Read/Write and Contents Read/Write'
    required: true

outputs:
  issue-url:
    description: 'URL of the created issue'
    value: ${{ steps.create-issue.outputs.issue_url }}
  issue-number:
    description: 'Number of the created issue'
    value: ${{ steps.create-issue.outputs.issue_number }}
  is-new:
    description: 'true if a new issue was created, false if an existing one was updated'
    value: ${{ steps.create-issue.outputs.is_new }}

runs:
  using: composite
  steps:
    - name: Collect repository structure
      id: context
      shell: bash
      run: |
        echo "Collecting repository structure for issue context..."
        {
          echo "## Repository Structure"
          echo '```'
          find ${{ inputs.scan-paths }} -maxdepth 4 -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './bin/*' \
            -not -path './obj/*' \
            -not -path './.vs/*' \
            -not -name '*.dll' -not -name '*.exe' \
            -not -name '*.png' -not -name '*.jpg' -not -name '*.zip' \
            2>/dev/null | sort | head -150 || true
          echo '```'
          echo ""
          echo "## Statistics"
          echo "- **Total files**: $(find ${{ inputs.scan-paths }} -type f -not -path './.git/*' 2>/dev/null | wc -l)"
          echo "- **YAML workflows**: $(find . -name '*.yml' -o -name '*.yaml' | grep -v '.git' | wc -l)"
          echo "- **Dockerfile**: $(find . -name 'Dockerfile*' | wc -l)"
          echo "- **Scripts**: $(find . \( -name '*.ps1' -o -name '*.sh' \) | grep -v '.git' | wc -l)"
          echo "- **.NET code**: $(find . -name '*.cs' -o -name '*.csproj' | wc -l)"
        } > repo-structure.md 2>/dev/null || echo "Error collecting structure" > repo-structure.md

    - name: Create issue for Coding Agent
      id: create-issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.assign-pat }}
      run: |
        REPO="${{ github.repository }}"
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
        ISSUE_TITLE="${{ inputs.issue-title }}"

        # Check if an open issue with the same title already exists (one issue per repo)
        EXISTING_ISSUE=$(gh issue list --repo "$REPO" --state open --label "copilot-auto" \
          --search "$ISSUE_TITLE" --json number,url --jq '.[0]' 2>/dev/null || echo "")

        if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
          EXISTING_NUMBER=$(echo "$EXISTING_ISSUE" | jq -r '.number')
          EXISTING_URL=$(echo "$EXISTING_ISSUE" | jq -r '.url')
          echo "Existing issue found: #${EXISTING_NUMBER} (${EXISTING_URL})"
          echo "Updating existing issue with new context..."

          # Update the body of the existing issue
          cat > issue-body.md << 'EOF'
        ${{ inputs.task-prompt }}
        EOF

          cat >> issue-body.md << EOF

        ---

        ### Automatic context (updated)

        **Repository**: ${REPO}
        **Branch**: ${{ github.ref_name }}
        **Commit**: ${{ github.sha }}
        **Timestamp**: ${TIMESTAMP}
        **Trigger**: AI Security Scan Pipeline (update)

        EOF

          cat repo-structure.md >> issue-body.md 2>/dev/null || true

          cat >> issue-body.md << 'EOF'

        ---

        ### Actions required from the Coding Agent:
        1. Analyze all source code in the repository
        2. Generate a detailed report of issues found
        3. **Open ONE Pull Request** linked to this issue with fixes for CRITICAL and HIGH issues
        4. Comment on this issue with the full report
        5. The PR must reference this issue with "Closes #NUMBER" in the body
        EOF

          gh issue edit "$EXISTING_NUMBER" --repo "$REPO" --body-file issue-body.md 2>/dev/null || true
          echo "issue_url=${EXISTING_URL}" >> $GITHUB_OUTPUT
          echo "issue_number=${EXISTING_NUMBER}" >> $GITHUB_OUTPUT
          echo "is_new=false" >> $GITHUB_OUTPUT
          echo "Existing issue updated: ${EXISTING_URL}"
          exit 0
        fi

        # Build the body for the new issue
        cat > issue-body.md << 'EOF'
        ${{ inputs.task-prompt }}
        EOF

        cat >> issue-body.md << EOF

        ---

        ### Automatic context

        **Repository**: ${REPO}
        **Branch**: ${{ github.ref_name }}
        **Commit**: ${{ github.sha }}
        **Timestamp**: ${TIMESTAMP}
        **Trigger**: AI Security Scan Pipeline

        EOF

        cat repo-structure.md >> issue-body.md 2>/dev/null || true

        cat >> issue-body.md << 'EOF'

        ---

        ### Actions required from the Coding Agent:
        1. Analyze all source code in the repository
        2. Generate a detailed report of issues found
        3. **Open ONE Pull Request** linked to this issue with fixes for CRITICAL and HIGH issues
        4. Comment on this issue with the full report
        5. The PR must reference this issue with "Closes #NUMBER" in the body
        EOF

        # Create the issue (build --label flags separately)
        LABEL_FLAGS=""
        IFS=',' read -ra LABEL_ARRAY <<< "${{ inputs.labels }}"
        for lbl in "${LABEL_ARRAY[@]}"; do
          lbl=$(echo "$lbl" | xargs)  # trim whitespace
          if [ -n "$lbl" ]; then
            # Create the label if it does not exist
            gh label create "$lbl" --repo "$REPO" --color "ededed" 2>/dev/null || true
            LABEL_FLAGS="${LABEL_FLAGS} --label ${lbl}"
          fi
        done

        ISSUE_URL=$(gh issue create \
          --repo "$REPO" \
          --title "${{ inputs.issue-title }} - ${TIMESTAMP}" \
          --body-file issue-body.md \
          ${LABEL_FLAGS} 2>&1)

        echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT

        # Extract issue number from URL
        ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oP '/issues/\K[0-9]+' || echo "")
        echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
        echo "is_new=true" >> $GITHUB_OUTPUT
        echo "Issue created: ${ISSUE_URL}"

    - name: Assign Copilot Coding Agent via GraphQL
      if: steps.create-issue.outputs.is_new == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.assign-pat }}
      run: |
        ISSUE_NUMBER="${{ steps.create-issue.outputs.issue_number }}"
        REPO_FULL="${{ github.repository }}"
        OWNER=$(echo "$REPO_FULL" | cut -d'/' -f1)
        REPO_NAME=$(echo "$REPO_FULL" | cut -d'/' -f2)

        if [ -z "$ISSUE_NUMBER" ]; then
          echo "Issue number not available, skipping assignment"
          exit 0
        fi

        echo "Assigning Copilot to issue #${ISSUE_NUMBER}..."

        ISSUE_NODE_ID=$(gh api graphql -f query='
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $number) { id }
            }
          }' -f owner="$OWNER" -f repo="$REPO_NAME" -F number="$ISSUE_NUMBER" \
          --jq '.data.repository.issue.id')

        COPILOT_ID=$(gh api graphql \
          -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
          -f query='
          query($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              suggestedActors(first: 10, capabilities: [CAN_BE_ASSIGNED]) {
                nodes {
                  login
                  ... on Bot { id }
                  ... on User { id }
                }
              }
            }
          }' -f owner="$OWNER" -f repo="$REPO_NAME" \
          --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')

        gh api graphql \
          -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
          -f query="mutation { addAssigneesToAssignable(input: { assignableId: \"$ISSUE_NODE_ID\", assigneeIds: [\"$COPILOT_ID\"] }) { clientMutationId } }" \
          && echo "  Copilot assigned" \
          || echo "  Error assigning Copilot"
    - name: Summary
      shell: bash
      run: |
        echo "## AI Security & Quality Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Issue created and assigned to Coding Agent**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Issue | ${{ steps.create-issue.outputs.issue_url }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Number | #${{ steps.create-issue.outputs.issue_number }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Assigned to | @copilot |" >> $GITHUB_STEP_SUMMARY
        echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next steps (automated)" >> $GITHUB_STEP_SUMMARY
        echo "1. The Coding Agent will analyze the source code" >> $GITHUB_STEP_SUMMARY
        echo "2. It will comment on the issue with the report" >> $GITHUB_STEP_SUMMARY
        echo "3. It will open a PR with fixes for CRITICAL/HIGH issues" >> $GITHUB_STEP_SUMMARY
