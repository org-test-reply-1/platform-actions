name: Copilot CLI Setup
description: 'Installs and configures GitHub Copilot CLI'

inputs:
  copilot-token:
    description: 'GitHub token with Copilot access'
    required: true

runs:
  using: composite
  steps:
    - name: Install GitHub Copilot extension
      shell: bash
      run: |
        gh extension install github/gh-copilot 2>/dev/null || true
      env:
        GH_TOKEN: ${{ inputs.copilot-token }}

    - name: Verify installation
      shell: bash
      run: |
        echo "Copilot CLI setup complete"
        gh copilot --version 2>/dev/null || echo "Version not available"
      env:
        GH_TOKEN: ${{ inputs.copilot-token }}
