# platform-actions/create-copilot-issue/action.yml
name: 'Create Copilot Issue'
description: 'Creates an issue with context and assigns it to @copilot to activate the Coding Agent'

inputs:
  title:
    description: 'Issue title'
    required: true
  body:
    description: 'Issue body with error context'
    required: true
  labels:
    description: 'Comma-separated labels'
    required: false
    default: 'copilot-auto'
  assign-pat:
    description: 'Fine-grained PAT with Issues Read/Write'
    required: true

outputs:
  issue-url:
    description: 'URL of the created issue'
    value: ${{ steps.create.outputs.issue_url }}
  issue-number:
    description: 'Number of the created issue'
    value: ${{ steps.create.outputs.issue_number }}

runs:
  using: 'composite'
  steps:
    - name: Create issue
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.assign-pat }}
      run: |
        # Create the issue with labels
        ISSUE_URL=$(gh issue create \
          --title "${{ inputs.title }}" \
          --body "${{ inputs.body }}" \
          --label "${{ inputs.labels }}" 2>&1)

        echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT

        # Extract the issue number from the URL
        ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oP '/issues/\K[0-9]+')
        echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
        echo "Issue created: ${ISSUE_URL}"

    - name: Assign to @copilot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.assign-pat }}
      run: |
        ISSUE_NUMBER="${{ steps.create.outputs.issue_number }}"
        REPO="${{ github.repository }}"
        OWNER=$(echo "$REPO" | cut -d'/' -f1)
        NAME=$(echo "$REPO" | cut -d'/' -f2)

        # Assign to @copilot via GraphQL API
        # (gh issue edit --add-assignee does not support @copilot directly)
        gh api graphql -f query='
          mutation {
            updateIssue(input: {
              id: "'"$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.node_id')"'"
              assigneeIds: ["'"$(gh api "/users/copilot" --jq '.node_id' 2>/dev/null || echo "")"'"]
            }) {
              issue {
                url
                assignees(first: 5) {
                  nodes { login }
                }
              }
            }
          }
        ' 2>/dev/null || echo "Direct assignment to @copilot failed, trying fallback..."

        # Fallback: try with gh issue edit
        gh issue edit "$ISSUE_NUMBER" --add-assignee "copilot" 2>/dev/null || \
          echo "Assign @copilot fallback: verify manually issue #${ISSUE_NUMBER}"

        echo "Issue #${ISSUE_NUMBER} assigned to @copilot"
