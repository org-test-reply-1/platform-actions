name: Deploy ARC Runner Scale Set
description: "Installa/aggiorna controller e runner scale set ARC, restart controller"

inputs:
  arc_system_namespace:
    description: "Namespace del controller ARC"
    required: false
    default: "arc-system"
  arc_namespace:
    description: "Namespace Kubernetes dei runner"
    required: false
    default: "arc-runners"
  arc_runner_set_name:
    description: "Nome dell'installazione Helm del runner scale set"
    required: false
    default: "arc-runner-set"
  values_yaml_path:
    description: "Percorso del values.yaml per il runner scale set"
    required: false
    default: "./arc-runner-image/values.yaml"

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- #
    # 1. Installa/aggiorna il controller ARC
    # ---------------------------------------------------------------- #
    - name: Helm upgrade arc-controller
      shell: bash
      run: |
        helm upgrade arc \
          --install \
          --namespace ${{ inputs.arc_system_namespace }} \
          --create-namespace \
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
          --wait \
          --timeout 5m

    # ---------------------------------------------------------------- #
    # 3. Installa/aggiorna il runner scale set
    # ---------------------------------------------------------------- #
    - name: Helm upgrade arc-runner-set
      shell: bash
      run: |
        helm upgrade ${{ inputs.arc_runner_set_name }} \
          --install \
          --namespace ${{ inputs.arc_namespace }} \
          --create-namespace \
          -f ${{ inputs.values_yaml_path }} \
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
          --wait \
          --timeout 5m

    # ---------------------------------------------------------------- #
    # 4. Restart controller
    # ---------------------------------------------------------------- #
    - name: Restart ARC controller
      shell: bash
      run: |
        kubectl rollout restart deployment arc-gha-rs-controller \
          -n ${{ inputs.arc_system_namespace }}

        kubectl rollout status deployment arc-gha-rs-controller \
          -n ${{ inputs.arc_system_namespace }} \
          --timeout=120s
