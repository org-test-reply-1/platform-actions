name: Deploy ARC Runner Scale Set
description: "Installs or upgrades the ARC runner scale set and restarts the controller"

inputs:
  arc_system_namespace:
    description: "Namespace of the ARC controller"
    required: false
    default: "arc-system"
  arc_namespace:
    description: "Kubernetes namespace for the runners"
    required: false
    default: "arc-runners"
  arc_runner_set_name:
    description: "Helm release name of the runner scale set"
    required: false
    default: "arc-runner-set"
  values_yaml_path:
    description: "Path to the values.yaml for the runner scale set"
    required: false
    default: "./arc-runner-image/values.yaml"

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- #
    # 1. Install or upgrade the runner scale set
    # ---------------------------------------------------------------- #
    - name: Helm upgrade arc-runner-set
      shell: bash
      run: |
        helm upgrade ${{ inputs.arc_runner_set_name }} \
          --install \
          --namespace ${{ inputs.arc_namespace }} \
          --create-namespace \
          -f ${{ inputs.values_yaml_path }} \
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
          --wait \
          --timeout 5m

    # ---------------------------------------------------------------- #
    # 2. Restart controller
    # ---------------------------------------------------------------- #
    - name: Restart ARC controller
      shell: bash
      run: |
        kubectl rollout restart deployment arc-gha-rs-controller \
          -n ${{ inputs.arc_system_namespace }}

        kubectl rollout status deployment arc-gha-rs-controller \
          -n ${{ inputs.arc_system_namespace }} \
          --timeout=120s
